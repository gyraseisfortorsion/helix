services:
  api:
    build: .
    init: true
    restart: unless-stopped
    stop_grace_period: 180s
    ports:
      - "127.0.0.1:${API_PORT:-8000}:8000"
    # Optional for offline/local testing; VPS users copy deploy/vps.env.example.
    env_file:
      - path: .env
        required: false
    environment:
      DNA_DATA_DIR: /data
      DNA_ALLOW_LOCAL_WORKSPACES: "false"
      DNA_EMBEDDED_WORKER: "true"
    volumes:
      - helix-data:/data
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
  caddy:
    image: caddy:2.11.7-alpine
    profiles: [https]
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      API_DOMAIN: "${API_DOMAIN:-localhost}"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
volumes:
  helix-data:
  caddy-data:
  caddy-config:
