[project]
name = "helix-health"
version = "0.1.0"
description = "An evidence-first personal genetics research workspace"
requires-python = ">=3.12,<3.14"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn[standard]>=0.34,<1",
  "pydantic>=2.10,<3", "pydantic-settings>=2.7,<3",
  "pydantic-ai-slim[anthropic]>=1,<3", "httpx>=0.28,<1",
  "python-multipart>=0.0.20", "duckdb>=1.2,<2", "pyarrow>=19",
  "numpy>=2,<3", "pysam>=0.23,<1", "python-dotenv>=1,<2",
]

[project.optional-dependencies]
science = ["alphagenome"]
dev = ["pytest>=8", "pytest-asyncio>=0.25", "respx>=0.22", "ruff>=0.11"]

[project.scripts]
helix-api = "api.main:serve"
helix-worker = "api.worker:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["api"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
target-version = "py312"
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B"]
ignore = ["B008"]
